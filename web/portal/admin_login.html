<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — MediQR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: #0f0f1a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: #161628;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 40px 32px;
            margin: 20px;
        }

        .login-card .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-card .logo .icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .login-card .logo h1 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-card .logo p {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: #0f0f1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #6366f1;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s;
            margin-top: 4px;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-msg {
            background: rgba(230, 57, 70, 0.1);
            border: 1px solid rgba(230, 57, 70, 0.3);
            color: #e63946;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #555;
            text-decoration: none;
        }

        .back-link:hover {
            color: #888;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="logo">
            <div class="icon">🛡️</div>
            <h1>MediQR Admin</h1>
            <p>Sign in to the admin dashboard</p>
        </div>

        <div class="error-msg" id="error-msg"></div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="admin@mediqr.com" autofocus>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button class="login-btn" id="login-btn">Sign In</button>

        <a href="login.html" class="back-link">← Back to Paramedic Login</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function () {
            var SUPABASE_URL = 'https://krpmrkxustljymgnwrzq.supabase.co';
            var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtycG1ya3h1c3RsanltZ253cnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4MjIxNDIsImV4cCI6MjA4NzM5ODE0Mn0.SmP5GhPK9u2K-hpMFmIAwR00T9CzFLEY8ROGeC0m69w';

            if (!window.supabase || !window.supabase.createClient) {
                document.getElementById('error-msg').textContent = 'Failed to load. Please refresh.';
                document.getElementById('error-msg').style.display = 'block';
                return;
            }

            var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // Check if already logged in as admin
            (async function () {
                var result = await sb.auth.getSession();
                if (result.data.session) {
                    var roleResult = await sb.from('user_roles').select('role').eq('user_id', result.data.session.user.id).single();
                    if (roleResult.data && roleResult.data.role === 'admin') {
                        window.location.href = 'admin.html';
                        return;
                    }
                }
            })();

            var $email = document.getElementById('email');
            var $password = document.getElementById('password');
            var $btn = document.getElementById('login-btn');
            var $error = document.getElementById('error-msg');

            function showError(msg) {
                $error.textContent = msg;
                $error.style.display = 'block';
            }

            $btn.addEventListener('click', login);
            $password.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') login();
            });

            async function login() {
                var email = $email.value.trim();
                var password = $password.value;

                if (!email || !password) {
                    showError('Please enter email and password.');
                    return;
                }

                $btn.disabled = true;
                $btn.textContent = 'Signing in…';
                $error.style.display = 'none';

                try {
                    var result = await sb.auth.signInWithPassword({ email: email, password: password });

                    if (result.error) {
                        showError(result.error.message);
                        $btn.disabled = false;
                        $btn.textContent = 'Sign In';
                        return;
                    }

                    // Check role
                    var userId = result.data.user.id;
                    var roleResult = await sb.from('user_roles').select('role').eq('user_id', userId).single();

                    if (!roleResult.data || roleResult.data.role !== 'admin') {
                        showError('Access denied. Admin role required.');
                        await sb.auth.signOut();
                        $btn.disabled = false;
                        $btn.textContent = 'Sign In';
                        return;
                    }

                    // Success — go to dashboard
                    window.location.href = 'admin.html';

                } catch (err) {
                    showError('An unexpected error occurred.');
                    $btn.disabled = false;
                    $btn.textContent = 'Sign In';
                }
            }
        })();
    </script>
</body>

</html>
