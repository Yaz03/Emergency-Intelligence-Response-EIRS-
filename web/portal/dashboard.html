<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incident Dashboard — MediQR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: #1a1a2e;
            color: #fff;
        }

        .header {
            background: #16213e;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
        }

        .header .user-info {
            font-size: 13px;
            color: #888;
        }

        .logout-btn {
            padding: 8px 16px;
            background: rgba(230, 57, 70, 0.15);
            border: 1px solid rgba(230, 57, 70, 0.3);
            color: #e63946;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 40vh;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #0d6efd;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .tabs {
            display: flex;
            gap: 4px;
            background: #0f1629;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            color: #888;
        }

        .tab.active {
            background: #0d6efd;
            color: #fff;
        }

        .incident-card {
            background: #16213e;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .incident-card:hover {
            border-color: rgba(13, 110, 253, 0.4);
        }

        .incident-card.selected {
            border-color: #0d6efd;
        }

        .incident-card .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .incident-card .row:last-child {
            margin-bottom: 0;
        }

        .incident-card .label {
            font-size: 12px;
            color: #888;
        }

        .incident-card .value {
            font-size: 14px;
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-pending {
            background: rgba(255, 193, 7, 0.15);
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }

        .status-completed {
            background: rgba(46, 196, 134, 0.15);
            color: #2ec486;
            border: 1px solid rgba(46, 196, 134, 0.3);
        }

        .form-section {
            background: #16213e;
            border-radius: 14px;
            padding: 24px;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: none;
        }

        .form-section.visible {
            display: block;
        }

        .form-section h3 {
            font-size: 16px;
            margin-bottom: 20px;
            color: #0d6efd;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 6px;
        }

        .form-group select,
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            background: #0f1629;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group select:focus,
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #0d6efd;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group select option {
            background: #16213e;
        }

        .severity-grid {
            display: flex;
            gap: 8px;
        }

        .severity-btn {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            background: #0f1629;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            color: #888;
        }

        .severity-btn.active {
            border-color: #0d6efd;
            color: #0d6efd;
            background: rgba(13, 110, 253, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2ec486, #28a96c);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .success-msg {
            background: rgba(46, 196, 134, 0.1);
            border: 1px solid rgba(46, 196, 134, 0.3);
            color: #2ec486;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #555;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

    <div class="header">
        <div>
            <h1>📋 Incident Dashboard</h1>
            <div class="user-info" id="user-email">Loading…</div>
        </div>
        <button class="logout-btn" id="logout-btn">Sign Out</button>
    </div>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p style="margin-top:12px; color:#888; font-size:14px;">Loading incidents…</p>
    </div>

    <div class="container" id="main-content" style="display:none;">
        <div class="tabs">
            <div class="tab active" id="tab-pending" data-status="pending">⏳ Pending</div>
            <div class="tab" id="tab-completed" data-status="completed">✅ Completed</div>
        </div>

        <div id="incident-list"></div>

        <div id="empty-state" class="empty-state" style="display:none;">
            <div class="icon">📭</div>
            <p>No incidents found</p>
        </div>

        <div class="form-section" id="form-section">
            <h3>Complete Incident Report</h3>

            <div class="form-group">
                <label>Incident Type</label>
                <select id="incident-type">
                    <option value="">— Select type —</option>
                    <option value="cardiac">🫀 Cardiac Emergency</option>
                    <option value="respiratory">🫁 Respiratory Distress</option>
                    <option value="trauma">🩹 Trauma / Injury</option>
                    <option value="road_accident">🚗 Road Accident</option>
                    <option value="neurological">🧠 Neurological Event</option>
                    <option value="allergic">⚠️ Allergic Reaction</option>
                    <option value="diabetic">💉 Diabetic Emergency</option>
                    <option value="seizure">⚡ Seizure</option>
                    <option value="other">📋 Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Severity (1 = Low, 5 = Critical)</label>
                <div class="severity-grid">
                    <div class="severity-btn" data-severity="1">1</div>
                    <div class="severity-btn" data-severity="2">2</div>
                    <div class="severity-btn" data-severity="3">3</div>
                    <div class="severity-btn" data-severity="4">4</div>
                    <div class="severity-btn" data-severity="5">5</div>
                </div>
            </div>

            <div class="form-group">
                <label>Reason / Notes</label>
                <textarea id="reason" placeholder="Describe the incident details…"></textarea>
            </div>

            <div class="success-msg" id="success-msg">✅ Incident report completed successfully!</div>
            <button class="submit-btn" id="submit-btn">Complete Report</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function () {
            var SUPABASE_URL = 'https://krpmrkxustljymgnwrzq.supabase.co';
            var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtycG1ya3h1c3RsanltZ253cnpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4MjIxNDIsImV4cCI6MjA4NzM5ODE0Mn0.SmP5GhPK9u2K-hpMFmIAwR00T9CzFLEY8ROGeC0m69w';

            if (!window.supabase || !window.supabase.createClient) {
                document.getElementById('loading').innerHTML = '<p style="color:#e63946">Failed to load. Please refresh.</p>';
                return;
            }

            var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('Dashboard: Supabase client created');

            // State
            var allIncidents = [];
            var selectedIncidentId = null;
            var selectedSeverity = null;
            var currentFilter = 'pending';

            // DOM
            var $loading = document.getElementById('loading');
            var $main = document.getElementById('main-content');
            var $list = document.getElementById('incident-list');
            var $empty = document.getElementById('empty-state');
            var $form = document.getElementById('form-section');
            var $success = document.getElementById('success-msg');
            var $submitBtn = document.getElementById('submit-btn');

            function getParam(name) {
                return new URLSearchParams(window.location.search).get(name);
            }

            function formatDate(dateStr) {
                if (!dateStr) return '—';
                var d = new Date(dateStr);
                return d.toLocaleString('en-IN', {
                    day: 'numeric', month: 'short', year: 'numeric',
                    hour: '2-digit', minute: '2-digit',
                });
            }

            // Auth check
            async function checkAuth() {
                var result = await sb.auth.getSession();
                if (!result.data.session) {
                    window.location.href = 'login.html';
                    return null;
                }
                document.getElementById('user-email').textContent = result.data.session.user.email;
                return result.data.session;
            }

            // Logout
            document.getElementById('logout-btn').addEventListener('click', async function () {
                await sb.auth.signOut();
                window.location.href = 'login.html';
            });

            // Fetch incidents
            async function fetchIncidents() {
                var result = await sb.from('incidents').select('*').order('scan_time', { ascending: false });
                if (result.error) {
                    console.error('Failed to fetch incidents:', result.error.message);
                    return [];
                }
                return result.data || [];
            }

            // Reverse geocode cache
            var geoCache = {};

            async function reverseGeocode(lat, lng) {
                var key = lat.toFixed(3) + ',' + lng.toFixed(3);
                if (geoCache[key]) return geoCache[key];
                try {
                    var resp = await fetch('https://nominatim.openstreetmap.org/reverse?lat=' + lat + '&lon=' + lng + '&format=json&zoom=10');
                    var data = await resp.json();
                    var addr = data.address || {};
                    var name = addr.city || addr.town || addr.village || addr.county || addr.state || '';
                    if (addr.state && name !== addr.state) name += ', ' + addr.state;
                    geoCache[key] = name;
                    return name;
                } catch (e) { return ''; }
            }

            // Render incidents
            function renderIncidents() {
                var filtered = allIncidents.filter(function (i) { return i.status === currentFilter; });

                if (filtered.length === 0) {
                    $list.innerHTML = '';
                    $empty.style.display = 'block';
                    $form.classList.remove('visible');
                    return;
                }

                $empty.style.display = 'none';

                $list.innerHTML = filtered.map(function (incident) {
                    var locationHtml = (incident.latitude && incident.longitude)
                        ? '<a href="https://maps.google.com/?q=' + incident.latitude + ',' + incident.longitude + '" target="_blank" style="color:#0d6efd; text-decoration:none;">📍 ' + Number(incident.latitude).toFixed(4) + ', ' + Number(incident.longitude).toFixed(4) + '</a><span class="geo-name" data-lat="' + incident.latitude + '" data-lng="' + incident.longitude + '" style="display:block;font-size:12px;color:#aaa;margin-top:2px;"></span>'
                        : 'GPS unavailable';

                    var extraRows = '';
                    if (incident.incident_type) {
                        extraRows += '<div class="row"><span class="label">Type</span><span class="value">' + incident.incident_type + '</span></div>';
                    }
                    if (incident.severity) {
                        extraRows += '<div class="row"><span class="label">Severity</span><span class="value">' + '🔴'.repeat(incident.severity) + '⚪'.repeat(5 - incident.severity) + '</span></div>';
                    }
                    if (incident.reason) {
                        extraRows += '<div class="row"><span class="label">Reason</span><span class="value" style="max-width:70%">' + incident.reason + '</span></div>';
                    }

                    return '<div class="incident-card ' + (incident.id === selectedIncidentId ? 'selected' : '') + '" data-id="' + incident.id + '">' +
                        '<div class="row"><span class="label">Scan Time</span><span class="value">' + formatDate(incident.scan_time) + '</span></div>' +
                        '<div class="row"><span class="label">Location</span><span class="value">' + locationHtml + '</span></div>' +
                        '<div class="row"><span class="label">Status</span><span class="status-badge status-' + incident.status + '">' + incident.status + '</span></div>' +
                        extraRows +
                        '</div>';
                }).join('');

                // Resolve location names asynchronously
                document.querySelectorAll('.geo-name').forEach(async function (el) {
                    var lat = parseFloat(el.dataset.lat);
                    var lng = parseFloat(el.dataset.lng);
                    var name = await reverseGeocode(lat, lng);
                    if (name) el.textContent = '📌 ' + name;
                });

                // Click handlers
                document.querySelectorAll('.incident-card').forEach(function (card) {
                    card.addEventListener('click', function () {
                        var id = card.dataset.id;
                        var incident = allIncidents.find(function (i) { return i.id === id; });
                        if (incident && incident.status === 'pending') {
                            selectIncident(id);
                        }
                    });
                });
            }

            function selectIncident(id) {
                selectedIncidentId = id;
                $form.classList.add('visible');
                $success.style.display = 'none';
                document.getElementById('incident-type').value = '';
                document.getElementById('reason').value = '';
                selectedSeverity = null;
                document.querySelectorAll('.severity-btn').forEach(function (b) { b.classList.remove('active'); });
                renderIncidents();
                $form.scrollIntoView({ behavior: 'smooth' });
            }

            // Severity selector
            document.querySelectorAll('.severity-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    selectedSeverity = parseInt(btn.dataset.severity);
                    document.querySelectorAll('.severity-btn').forEach(function (b) { b.classList.remove('active'); });
                    btn.classList.add('active');
                });
            });

            // Submit completion
            $submitBtn.addEventListener('click', async function () {
                if (!selectedIncidentId) return;

                var incidentType = document.getElementById('incident-type').value;
                var reason = document.getElementById('reason').value.trim();

                if (!incidentType) { alert('Please select an incident type.'); return; }
                if (!selectedSeverity) { alert('Please select a severity level.'); return; }

                $submitBtn.disabled = true;
                $submitBtn.textContent = 'Submitting…';

                var result = await sb.from('incidents').update({
                    incident_type: incidentType,
                    severity: selectedSeverity,
                    reason: reason || null,
                    status: 'completed',
                }).eq('id', selectedIncidentId);

                if (result.error) {
                    alert('Failed to update: ' + result.error.message);
                    $submitBtn.disabled = false;
                    $submitBtn.textContent = 'Complete Report';
                    return;
                }

                $success.style.display = 'block';
                $submitBtn.textContent = '✅ Completed';

                setTimeout(async function () {
                    allIncidents = await fetchIncidents();
                    selectedIncidentId = null;
                    $form.classList.remove('visible');
                    $submitBtn.disabled = false;
                    $submitBtn.textContent = 'Complete Report';
                    renderIncidents();
                }, 1500);
            });

            // Tabs
            document.querySelectorAll('.tab').forEach(function (tab) {
                tab.addEventListener('click', function () {
                    currentFilter = tab.dataset.status;
                    document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
                    tab.classList.add('active');
                    selectedIncidentId = null;
                    $form.classList.remove('visible');
                    renderIncidents();
                });
            });

            // Init
            async function init() {
                var session = await checkAuth();
                if (!session) return;

                allIncidents = await fetchIncidents();
                $loading.style.display = 'none';
                $main.style.display = 'block';

                var incidentId = getParam('incident_id');
                if (incidentId) { selectIncident(incidentId); }

                renderIncidents();
            }

            init();
        })();
    </script>
</body>

</html>
