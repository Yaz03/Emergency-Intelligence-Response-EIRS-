<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIRS - Emergency Intelligence & Response System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .logo-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: inline-block;
            animation: pulse-logo 2s infinite ease-in-out;
        }

        @keyframes pulse-logo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
            color: #fff;
        }

        h1 span {
            color: #e63946;
        }

        p {
            color: #888;
            font-size: 16px;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 480px) {
            .btn-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            background: #16213e;
            border-radius: 16px;
            text-decoration: none;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .card-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: transparent;
            transition: background 0.3s ease;
        }

        .card-btn:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
            background: #1f2d50;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .card-btn.scanner:hover::before { background: #e63946; }
        .card-btn.paramedic:hover::before { background: #4361ee; }
        .card-btn.admin:hover::before { background: #2ec486; }

        .icon {
            font-size: 36px;
            margin-bottom: 16px;
            display: block;
        }

        .title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
            color: #f1f1f1;
        }

        .desc {
            font-size: 14px;
            color: #888;
            display: block;
        }

        .footer {
            margin-top: 60px;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-icon">🚨</div>
        <h1>EIRS <span>Portal</span></h1>
        <p>Welcome to the Emergency Intelligence & Response System.<br>Please select your destination below.</p>

        <div class="btn-grid">
            <a href="scanner.html" class="card-btn scanner">
                <span class="icon">📷</span>
                <span class="title">QR Scanner</span>
                <span class="desc">Scan patient QR codes in an emergency</span>
            </a>
            
            <a href="login.html" class="card-btn paramedic">
                <span class="icon">🚑</span>
                <span class="title">Paramedic Portal</span>
                <span class="desc">Login to manage emergency incidents</span>
            </a>
            
            <a href="admin_login.html" class="card-btn admin" style="grid-column: 1 / -1; max-width: 300px; margin: 0 auto; width: 100%;">
                <span class="icon">🛡️</span>
                <span class="title">Admin Dashboard</span>
                <span class="desc">System analytics and user oversight</span>
            </a>
        </div>

        <div class="footer">
            &copy; EIRS System
        </div>
    </div>
</body>
</html>
